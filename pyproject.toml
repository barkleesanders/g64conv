[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "g64conv"
version = "0.1.0"
description = "Native converter for Genetec .g64/.g64x CCTV video archives to MP4 and other formats (no Wine, no vendor player)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["genetec", "g64", "g64x", "omnicast", "security-center", "cctv", "video", "ffmpeg", "h264", "fisheye"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Multimedia :: Video :: Conversion",
]
dependencies = ["av>=12"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
g64conv = "g64conv.cli:main"

[project.urls]
Homepage = "https://github.com/barkleesanders/g64conv"
Issues = "https://github.com/barkleesanders/g64conv/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
